# 型検査やビルドが通るか確認するワークフロー
---
name: ci
on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    types: ["opened", "synchronize", "reopened"]

permissions: {}

defaults:
  run:
    shell: bash

# ワークフローが複数起動したら自動キャンセル
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get Node.js version
        id: get_node_version
        run: |
          echo "node_version=$(yq '.tools.node' mise.toml)" >> $GITHUB_OUTPUT

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.get_node_version.outputs.node_version }}
          cache: "npm"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache
        with:
          key: ${{ runner.arch }}-${{ runner.os }}-node-${{ steps.get_node_version.outputs.node_version }}-docusaurus-${{ hashFiles( 'blog/**', 'src/**', 'static/**', 'docusaurus.config.ts', 'package-lock.json', 'sidebars.ts', 'tsconfig.json') }}
          path: |
            .docusaurus
            build
            node_modules

      - if: ${{ steps.cache.outputs.cache-hit != 'true'}}
        run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
